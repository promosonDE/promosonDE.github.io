<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Minecraft-style grass block -->
  <rect width="16" height="16" fill="#6B4F12"/>
  <rect x="1" y="1" width="14" height="14" fill="#8B6914"/>
  <!-- dirt speckles -->
  <rect x="3" y="8" width="2" height="2" fill="#6B4F12"/>
  <rect x="9" y="7" width="2" height="2" fill="#6B4F12"/>
  <rect x="6" y="11" width="2" height="2" fill="#6B4F12"/>
  <rect x="11" y="11" width="2" height="2" fill="#6B4F12"/>
  <!-- grass cap -->
  <rect x="1" y="1" width="14" height="5" fill="#5D8C3E"/>
  <rect x="1" y="6" width="14" height="1" fill="#4A7A2E"/>
  <!-- grass shading -->
  <rect x="3" y="2" width="3" height="2" fill="#6BAF4A"/>
  <rect x="10" y="3" width="3" height="2" fill="#3B5E2B"/>
</svg>
