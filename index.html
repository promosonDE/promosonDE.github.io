<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- Icon (pixel-art grass block) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1a1a2e" />

    <!-- SEO -->
    <title>Promoson Poudel | Senior Data Engineer Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Promoson Poudel, Senior Data Engineer with 6+ years of experience building cloud-native lakehouse platforms, ETL/ELT pipelines, and analytics solutions across Azure, AWS, and GCP."
    />
    <meta name="author" content="Promoson Poudel" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Promoson Poudel Portfolio" />
    <meta property="og:title" content="Promoson Poudel | Senior Data Engineer Portfolio" />
    <meta
      property="og:description"
      content="Senior Data Engineer with 6+ years of experience building cloud-native lakehouse platforms and data solutions."
    />
    <meta name="twitter:card" content="summary" />

      name="twitter:description"
      content="Senior Data Engineer with 6+ years of experience building cloud-native lakehouse platforms and data solutions."
    />

    />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        overflow-x: clip;
      }
    </style>
  </head>
