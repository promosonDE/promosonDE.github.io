<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges" role="img" aria-label="Pixel art portrait of Promoson Poudel">
  <!-- background -->
  <rect width="16" height="16" fill="#1B1028"/>
  <!-- shoulders / shirt -->
  <rect x="1" y="13" width="14" height="3" fill="#4AEDD9"/>
  <rect x="1" y="13" width="14" height="1" fill="#2ABCA9"/>
  <rect x="1" y="15" width="14" height="1" fill="#2ABCA9"/>
  <!-- neck -->
  <rect x="6" y="11" width="4" height="2" fill="#A07850"/>
  <!-- head -->
  <rect x="3" y="3" width="10" height="8" fill="#C69C6D"/>
  <!-- hair -->
  <rect x="3" y="2" width="10" height="2" fill="#4A3520"/>
  <rect x="3" y="4" width="1" height="4" fill="#4A3520"/>
  <rect x="12" y="4" width="1" height="4" fill="#4A3520"/>
  <rect x="4" y="2" width="3" height="1" fill="#5A4329"/>
  <!-- eyes -->
  <rect x="5" y="6" width="2" height="2" fill="#FFFFFF"/>
  <rect x="6" y="7" width="1" height="1" fill="#2A1A10"/>
  <rect x="9" y="6" width="2" height="2" fill="#FFFFFF"/>
  <rect x="10" y="7" width="1" height="1" fill="#2A1A10"/>
  <!-- nose -->
  <rect x="8" y="8" width="1" height="1" fill="#A07850"/>
  <!-- smile -->
  <rect x="7" y="10" width="2" height="1" fill="#8B4513"/>
</svg>
